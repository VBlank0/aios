services:
  slot-a:
    build: .
    image: aios:latest
    container_name: aios-slot-a
    hostname: aios
    restart: unless-stopped
    privileged: true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - ./volumes/slot-a:/var/lib/aios
      - ./volumes/shared:/shared
    ports:
      - "2222:22"
    networks:
      - aios-net
    environment:
      - container=docker

networks:
  aios-net:
    driver: bridge
